<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08080B" />
    <title>Offline · FluxFin</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!--
      Deliberately a plain HTML file rather than a Next.js route.

      The offline fallback has to render with no network at all. A React page
      would ship its own JS chunks, and those are only in the service worker
      cache if the user happened to visit the route while online — so the page
      would render and then blow up during hydration. Everything here is
      inlined: no chunks, no fonts, no hydration, nothing to fetch.
    -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #08080b;
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .glow {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(
            40rem 30rem at 15% 0%,
            rgba(124, 58, 237, 0.16),
            transparent 70%
          ),
          radial-gradient(
            34rem 26rem at 85% 30%,
            rgba(56, 189, 248, 0.12),
            transparent 70%
          );
      }
      .card {
        position: relative;
        width: 100%;
        max-width: 26rem;
        padding: 2.25rem 2rem;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 1.25rem;
        background: rgba(17, 24, 39, 0.7);
        backdrop-filter: blur(20px);
        box-shadow:
          inset 0 1px 0 0 rgba(255, 255, 255, 0.05),
          0 24px 60px -32px rgba(0, 0, 0, 0.9);
      }
      .badge {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 1rem;
        background: linear-gradient(
          135deg,
          rgba(139, 92, 246, 0.2),
          rgba(34, 211, 238, 0.1)
        );
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.65;
        color: #a1a1aa;
      }
      button {
        margin-top: 1.75rem;
        width: 100%;
        height: 2.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border: 0;
        border-radius: 0.75rem;
        cursor: pointer;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        color: #fff;
        background: linear-gradient(135deg, #7c3aed, #a855f7 50%, #38bdf8);
        box-shadow: 0 8px 24px -8px rgba(124, 58, 237, 0.7);
        transition: transform 0.2s, box-shadow 0.3s;
      }
      button:hover {
        box-shadow: 0 12px 34px -8px rgba(124, 58, 237, 0.95);
      }
      button:active {
        transform: scale(0.98);
      }
      .hint {
        margin-top: 0.75rem;
        font-size: 0.75rem;
        color: #71717a;
      }
      .wordmark {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        font-size: 1rem;
        font-weight: 600;
      }
      .accent {
        background: linear-gradient(135deg, #7c3aed, #a855f7 50%, #38bdf8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>

    <main class="card">
      <span class="wordmark">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
          <defs>
            <linearGradient id="fluxfin-offline" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#7C3AED" />
              <stop offset="50%" stop-color="#A855F7" />
              <stop offset="100%" stop-color="#38BDF8" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="8" fill="rgba(255,255,255,0.04)" />
          <path
            d="M11 22V13.5C11 11.567 12.567 10 14.5 10H21"
            stroke="url(#fluxfin-offline)"
            stroke-width="2.6"
            stroke-linecap="round"
            fill="none"
          />
          <path
            d="M11 16.5H18.5"
            stroke="url(#fluxfin-offline)"
            stroke-width="2.6"
            stroke-linecap="round"
            fill="none"
          />
        </svg>
        Flux<span class="accent">Fin</span>
      </span>

      <div class="badge">
        <svg
          width="26"
          height="26"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#CDBAFF"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 20h.01" />
          <path d="M8.5 16.429a5 5 0 0 1 7 0" />
          <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
          <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
          <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
          <path d="m2 2 20 20" />
        </svg>
      </div>

      <h1>You are offline</h1>
      <p>
        FluxFin needs a connection to load your transactions. Nothing has been
        lost — everything is waiting on the server.
      </p>

      <button type="button" onclick="location.reload()">Try again</button>
      <p class="hint" id="hint">
        This page reloads itself as soon as you are back online.
      </p>
    </main>

    <script>
      // Inline so it works with no network. The moment connectivity returns,
      // send the user back to the real app rather than making them tap.
      window.addEventListener("online", function () {
        document.getElementById("hint").textContent = "Back online — reloading…";
        location.reload();
      });
    </script>
  </body>
</html>
